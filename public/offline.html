<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f3a32" />
    <title>You're offline — Scripture Reader</title>
    <style>
      body { align-items: center; background: #f8f7f2; color: #1f3a32; display: flex; font-family: system-ui, sans-serif; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; text-align: center; }
      main { max-width: 360px; }
      h1 { font-family: Georgia, serif; font-size: 2rem; margin-bottom: .5rem; }
      p { color: #4d5c55; line-height: 1.5; }
      button { background: #1f3a32; border: 0; border-radius: 8px; color: #fff; cursor: pointer; font: inherit; margin-top: 1rem; padding: .75rem 1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Reconnect to continue reading Scripture. Pages you've recently opened may still be available.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
